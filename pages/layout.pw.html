package pages

type Chrome { signedIn: bool, name: string }

external LoadChrome(): Chrome

export component Layout(children: html): html {
  {val chrome = LoadChrome()}
  <div class="min-h-screen">
    <header class="flex items-center justify-between border-b border-slate-200 bg-white px-6 py-3">
      <a class="text-lg font-bold tracking-tight text-indigo-700" href="/">Scrumify</a>
      {if chrome.signedIn}
        <div class="flex items-center gap-4 text-sm">
          <span class="text-slate-600">{chrome.name}</span>
          <form method="post" action="/auth/logout">
            <button
              class="rounded border border-slate-300 px-3 py-1 text-slate-600 hover:bg-slate-100"
              type="submit">ログアウト</button>
          </form>
        </div>
      {/if}
    </header>
    <main class="px-6 py-6"><slot required/></main>
  </div>
}
